<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Illus — Vector Editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff7a1a'/%3E%3Cpath d='M9 23 L16 8 L23 23' stroke='white' stroke-width='3' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="menubar"></header>
      <div id="optionsbar"></div>
      <div id="workspace">
        <aside id="toolbar"></aside>
        <main id="stage">
          <canvas id="canvas" resize></canvas>
          <textarea id="text-editor" spellcheck="false" hidden></textarea>
        </main>
        <aside id="panels"></aside>
      </div>
      <footer id="statusbar"></footer>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
